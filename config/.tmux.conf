# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start window numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers gapless when a window closes
set -g renumber-windows on

# Better split keys, always open in current dir
bind "\\" split-window -h -c "#{pane_current_path}"
bind "'" split-window -v -c "#{pane_current_path}"
#unbind '"'
#unbind %

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Better pane resizing
bind -r h resize-pane -L 10
bind -r j resize-pane -D 10
bind -r k resize-pane -U 10
bind -r l resize-pane -R 10

bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

bind v kill-window

# Reload config
bind r source-file ~/.tmux.conf

# Enable mouse control
set -g mouse on

# Copy mode
setw -g mode-keys vi
bind [ copy-mode
set -s set-clipboard on
set -s copy-command 'pbcopy -i'

# Pleaded for by LazyNvim
set -sg escape-time 10
set -g focus-events on
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Nested tmux: prefix + . hands the whole session to the inner tmux over SSH.
# The outer drops its prefix so C-a (and everything else) reaches the inner
# session directly; the outer only watches for C-a to catch prefix + .
# (toggle back) and forwards any other C-a combo to the inner untouched.
bind . {
    set prefix None
    set key-table off
    set status-style "fg=colour245,bg=colour238"
    set window-status-current-style "fg=colour245,bg=colour238"
    if -F '#{pane_in_mode}' 'send-keys -X cancel'
    refresh-client -S
}

bind -T off C-a switch-client -T off-intercept

bind -T off-intercept . {
    set -u prefix
    set -u key-table
    set -u status-style
    set -u window-status-current-style
    refresh-client -S
}

# send-keys without arguments resends the key that triggered the binding
bind -T off-intercept Any {
    send-keys C-a
    send-keys
}

# Tmux Plugins

set -g @plugin 'christoomey/vim-tmux-navigator'

# Add all plugins above this line
run '~/.tmux/plugins/tpm/tpm'
